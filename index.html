<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Weather Now</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">


    <!-- ================================================= -->
    <!-- LEFT PANEL -->
    <!-- ================================================= -->

    <div class="left-panel">


        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-sun"></i>

            <span>Weather Now</span>


            <!-- Temperature Unit -->

            <select id="unitSelect">

                <option value="C">°C</option>

                <option value="F">°F</option>

            </select>

        </div>


        <!-- HEADING -->

        <h1>

            How's the<br>

            sky looking<br>

            today?

        </h1>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                placeholder="Search for a place..."
                id="searchInput"
            >

            <button id="searchButton">
                Search
            </button>

        </div>


        <!-- ================================================= -->
        <!-- CURRENT WEATHER -->
        <!-- ================================================= -->

        <div class="weather-card">

            <div class="weather-top">


                <!-- Weather Image -->

                <img
                    src="images/cloudy.png"
                    alt="Weather"
                    id="weatherImage"
                >


                <!-- Weather Information -->

                <div class="weather-info">

                    <!-- IMPORTANT:
                         Berlin hata diya.
                         Ab initially Loading show hoga.
                    -->

                    <h2 id="cityName">
                        Loading...
                    </h2>


                    <p id="dateText">
                        Getting weather data...
                    </p>


                    <h1 id="temperature">
                        --°
                    </h1>

                </div>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- SMALL WEATHER CARDS -->
        <!-- ================================================= -->

        <div class="small-cards">


            <!-- FEELS LIKE -->

            <div class="card">

                <i class="fa-solid fa-temperature-half"></i>

                <div class="card-info">

                    <h3>
                        Feels Like
                    </h3>

                    <p id="feelsLike">
                        --
                    </p>

                </div>

            </div>


            <!-- HUMIDITY -->

            <div class="card">

                <i class="fa-solid fa-droplet"></i>

                <div class="card-info">

                    <h3>
                        Humidity
                    </h3>

                    <p id="humidity">
                        --
                    </p>

                </div>

            </div>


            <!-- WIND -->

            <div class="card">

                <i class="fa-solid fa-wind"></i>

                <div class="card-info">

                    <h3>
                        Wind
                    </h3>

                    <p id="wind">
                        --
                    </p>

                </div>

            </div>


            <!-- PRECIPITATION -->

            <div class="card">

                <i class="fa-solid fa-cloud-rain"></i>

                <div class="card-info">

                    <h3>
                        Precipitation
                    </h3>

                    <p id="precipitation">
                        --
                    </p>

                </div>

            </div>


        </div>


    </div>


    <!-- ================================================= -->
    <!-- RIGHT PANEL -->
    <!-- ================================================= -->

    <div class="right-panel">


        <!-- DAILY FORECAST -->

        <h2>
            Daily Forecast
        </h2>


        <div class="forecast" id="forecast">

            <!-- JavaScript yahan daily cards banayega -->

        </div>


        <!-- ================================================= -->
        <!-- HOURLY FORECAST -->
        <!-- ================================================= -->

        <div class="hourly">


            <div class="hour-title">

                <h2>
                    Hourly Forecast
                </h2>


                <select id="hourlySelect">

                    <option>Today</option>

                    <option>Tomorrow</option>

                    <option>Day 3</option>

                    <option>Day 4</option>

                    <option>Day 5</option>

                    <option>Day 6</option>

                    <option>Day 7</option>

                </select>

            </div>


            <!-- HOURLY CARDS -->

            <div class="hour-card" id="hourCard">

                <!-- JavaScript yahan hourly cards banayega -->

            </div>


        </div>


    </div>


</div>


<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script src="javascript.js"></script>


</body>

</html>
